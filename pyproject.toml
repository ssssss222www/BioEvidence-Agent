[project]
name = "literature-agent"
version = "0.1.0"
description = "Gene-list-driven biomedical literature research agent (Phase 0: PubMed retrieval)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "zhipuai>=2.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

# NOTE: the package is intentionally NOT installed for Phase 0; running from
# the project root (python main.py / pytest) works because the root directory
# contains the `app` package. Metadata is kept here for future phases.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Network tests hit real external APIs; skip them by default so offline/CI
# runs stay green. Run explicitly with: pytest -m network   /   pytest -m llm_network
addopts = "-m 'not network and not llm_network'"
markers = [
    "network: tests that call the real NCBI E-utilities (deselect with -m 'not network')",
    "llm_network: tests that call the real ZhipuAI GLM API (need GLM_API_KEY/GLM_MODEL; deselect with -m 'not llm_network')",
]
